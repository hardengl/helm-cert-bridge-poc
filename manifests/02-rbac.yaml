---
# The ARC controller in helm-cert-system needs cross-namespace access to
# manage secrets, pods, RBAC, and CRDs in helm-cert-runners.
# Without this, the controller cannot read the GitHub token secret or
# create listener roles in the runner namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: arc-controller-full
  labels:
    app.kubernetes.io/part-of: helm-cert-arc
rules:
- apiGroups: [""]
  resources: ["secrets", "pods", "serviceaccounts", "configmaps", "pods/log"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["roles", "rolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["actions.github.com"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: arc-controller-full-binding
  labels:
    app.kubernetes.io/part-of: helm-cert-arc
subjects:
- kind: ServiceAccount
  name: arc-system-gha-rs-controller
  namespace: helm-cert-system
roleRef:
  kind: ClusterRole
  name: arc-controller-full
  apiGroup: rbac.authorization.k8s.io
