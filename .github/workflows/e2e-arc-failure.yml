name: "E2E: ARC — Failure Path"

on:
  workflow_dispatch:

jobs:
  verify-bad-chart:
    runs-on: helm-cert
    steps:
      - name: "Verify non-existent chart (should FAIL)"
        run: |
          echo "=== Failure Path Test: Bad URL ==="
          chart-verifier verify \
            --set profile.vendorType=partner \
            "https://example.com/does-not-exist-chart-1.0.0.tgz" 2>&1

  verify-bad-structure:
    runs-on: helm-cert
    steps:
      - name: "Verify chart missing required files"
        run: |
          echo "=== Failure Path Test: Bad Structure ==="
          mkdir -p /tmp/bad-chart
          cat > /tmp/bad-chart/Chart.yaml << 'CHART'
          apiVersion: v2
          name: bad-chart
          version: 0.0.1
          CHART
          helm package /tmp/bad-chart -d /tmp/ 2>&1
          chart-verifier verify \
            --set profile.vendorType=partner \
            --disable chart-testing \
            /tmp/bad-chart-0.0.1.tgz 2>&1
