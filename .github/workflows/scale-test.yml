name: "Scale Test: Concurrent Chart Verifications"

# Simulates production load: ~40 PRs/day, with multiple running concurrently
# Tests ARC autoscaling from 0 → N runners simultaneously

on:
  workflow_dispatch:
    inputs:
      parallel_count:
        description: "Number of parallel chart verifications"
        required: true
        type: choice
        options: ["5", "10", "15", "20"]
        default: "10"

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Generate matrix
        id: set-matrix
        run: |
          COUNT=${{ inputs.parallel_count }}
          MATRIX=$(python3 -c "
          import json
          count = int('$COUNT')
          ids = [{'id': str(i+1), 'chart': f'partner-chart-{i+1}', 'vendor': f'vendor-{i+1}'} for i in range(count)]
          print(json.dumps({'include': ids}))
          ")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Matrix: $MATRIX"

  chart-verifier:
    runs-on: helm-cert
    needs: [generate-matrix]
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      max-parallel: 20
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          mkdir -p $HOME/bin
          curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o $HOME/bin/yq
          chmod +x $HOME/bin/yq
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install chart-verifier
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          source: github
          skip_cache: true
          chart-verifier: latest

      - name: OC Login
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://192.168.31.5:6443
          openshift_token: ${{ secrets.OC_TOKEN }}
          insecure_skip_tls_verify: true

      - name: Create namespace (sa-for-chart-testing equivalent)
        id: ns
        run: |
          NS="charts-scale-${{ github.run_id }}-${{ matrix.id }}"
          oc new-project "$NS" --skip-config-write 2>/dev/null || oc project "$NS"
          echo "ns=$NS" >> $GITHUB_OUTPUT
          echo "Created namespace: $NS"

      - name: Create and verify chart (${{ matrix.chart }})
        run: |
          START=$(date +%s)
          mkdir -p /tmp/chart-${{ matrix.id }}/templates
          cat > /tmp/chart-${{ matrix.id }}/Chart.yaml << EOF
          apiVersion: v2
          name: ${{ matrix.chart }}
          version: 1.0.0
          description: Scale test chart ${{ matrix.id }} from ${{ matrix.vendor }}
          type: application
          kubeVersion: ">=1.25.0"
          home: https://example.com/${{ matrix.vendor }}
          EOF
          cat > /tmp/chart-${{ matrix.id }}/README.md << EOF
          # ${{ matrix.chart }}
          Scale test chart for ${{ matrix.vendor }}
          EOF
          cat > /tmp/chart-${{ matrix.id }}/values.yaml << 'EOF'
          replicaCount: 1
          EOF
          cat > /tmp/chart-${{ matrix.id }}/templates/configmap.yaml << 'EOF'
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: {{ .Release.Name }}-config
          data:
            test: "true"
          EOF
          helm package /tmp/chart-${{ matrix.id }} -d /tmp/
          chart-verifier verify --disable chart-testing --set profile.vendorType=partner /tmp/${{ matrix.chart }}-1.0.0.tgz 2>&1 | tail -10
          END=$(date +%s)
          DURATION=$((END - START))
          echo ""
          echo "=== Result: ${{ matrix.chart }} ==="
          echo "  Vendor: ${{ matrix.vendor }}"
          echo "  Duration: ${DURATION}s"
          echo "  Runner: $(hostname)"

      - name: Extract report data (yq production equivalent)
        run: |
          # Simulate yq operations from production
          echo "Profile: v1.3"
          echo "KubeVersion: >=1.25.0"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "scale-test-${{ matrix.id }}"
          path: /tmp/${{ matrix.chart }}-1.0.0.tgz

      - name: Cleanup namespace
        if: always()
        run: |
          oc delete project "${{ steps.ns.outputs.ns }}" --wait=false 2>/dev/null || true

  summary:
    runs-on: ubuntu-latest
    needs: [chart-verifier]
    if: always()
    steps:
      - name: Scale test summary
        run: |
          echo "============================================="
          echo " Scale Test Results"
          echo "============================================="
          echo ""
          echo " Parallel count: ${{ inputs.parallel_count }}"
          echo " Chart-verifier result: ${{ needs.chart-verifier.result }}"
          echo ""
          echo " This validates ARC autoscaling:"
          echo "   - 0 runners → ${{ inputs.parallel_count }} runners simultaneously"
          echo "   - Each with isolated namespace"
          echo "   - Each running chart-verifier + oc + helm"
          echo "   - Artifact upload from each runner"
          echo ""
          echo " Production daily load: ~40 PRs"
          echo " Tested concurrent: ${{ inputs.parallel_count }}"
