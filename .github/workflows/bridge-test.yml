name: Bridge Connectivity Test

on:
  workflow_dispatch:

permissions:
  checks: write
  contents: read

jobs:
  dispatch-and-wait:
    runs-on: ubuntu-24.04
    steps:
      - name: Create pending check run for bridge
        id: create-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Creating check run for bridge to pick up ==="
          TIMESTAMP=$(date +%s)

          CHECK_RUN=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/check-runs" \
            -d "{
              \"name\": \"helm-cert-verify-test-${TIMESTAMP}\",
              \"head_sha\": \"${{ github.sha }}\",
              \"status\": \"queued\",
              \"output\": {
                \"title\": \"Bridge PoC Test\",
                \"summary\": \"Waiting for Helm Cert Bridge to pick up and process\"
              }
            }")

          CHECK_ID=$(echo "$CHECK_RUN" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id','FAILED'))")
          echo "check_id=$CHECK_ID" >> "$GITHUB_OUTPUT"
          echo "Created check run: $CHECK_ID"
          echo "$CHECK_RUN" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Name: {d.get(\"name\",\"?\")}  Status: {d.get(\"status\",\"?\")}  ID: {d.get(\"id\",\"?\")}')"

      - name: Wait for bridge to process
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMEOUT=300
          ELAPSED=0
          echo "Waiting for bridge to pick up check run..."

          while [ $ELAPSED -lt $TIMEOUT ]; do
            RESULT=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
              | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for run in data.get('check_runs', []):
              if run['name'].startswith('helm-cert-verify-test-'):
                  if run['status'] == 'completed':
                      print(f'completed:{run[\"conclusion\"]}')
                  else:
                      print(run['status'])
                  break
          ")

            if echo "$RESULT" | grep -q "^completed:"; then
              CONCLUSION=$(echo "$RESULT" | cut -d: -f2)
              echo "Bridge completed: $CONCLUSION"
              [ "$CONCLUSION" = "success" ] && exit 0 || exit 1
            fi

            echo "  Status: ${RESULT:-not-found} (${ELAPSED}s elapsed)"
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

          echo "Timeout — bridge did not process within ${TIMEOUT}s"
          echo "This is expected if bridge is not deployed yet"
          exit 1
