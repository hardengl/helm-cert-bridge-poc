name: "Real Chart Load Test: kni-qe-64 (customer-realistic)"

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/real-chart-load-test.yml'
      - 'tests/real-charts/**'

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      start_time: ${{ steps.timer.outputs.start }}
    steps:
      - uses: actions/checkout@v4
      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> $GITHUB_OUTPUT
      - name: Generate matrix from real chart files
        id: set-matrix
        run: |
          MATRIX=$(python3 -c "
          import json, os
          files = sorted(os.listdir('tests/real-charts'))
          ids = [{'file': f, 'name': f.rsplit('-', 1)[0] if '-' in f else f} for f in files if f.endswith('.tgz')]
          print(json.dumps({'include': ids}))
          ")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "$MATRIX"

  chart-verifier:
    runs-on: helm-cert-bm
    needs: [generate-matrix]
    strategy:
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      max-parallel: 25
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Install chart-verifier
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          source: github
          skip_cache: true
          chart-verifier: "1.16.0"

      - name: OC Login
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.kni-qe-64.ecosys.eng.rdu2.dc.redhat.com:6443
          openshift_token: ${{ secrets.OC_TOKEN_BM }}
          insecure_skip_tls_verify: true

      - name: Create namespace
        id: ns
        run: |
          NS="realchart-${{ github.run_id }}-$(echo ${{ matrix.file }} | md5sum | cut -c1-8)"
          oc new-project "$NS" --skip-config-write 2>/dev/null || oc project "$NS"
          echo "ns=$NS" >> $GITHUB_OUTPUT

      - name: Verify real chart (${{ matrix.file }})
        id: verify
        continue-on-error: true
        run: |
          START=$(date +%s)
          echo "=== Verifying REAL customer chart: ${{ matrix.file }} ==="
          ls -la tests/real-charts/${{ matrix.file }}
          chart-verifier verify --set profile.vendorType=partner "tests/real-charts/${{ matrix.file }}" 2>&1 | tee /tmp/result-${{ matrix.file }}.log | tail -30
          RC=$?
          END=$(date +%s)
          DURATION=$((END - START))
          echo "duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "runner=$(hostname)" >> $GITHUB_OUTPUT
          echo "rc=${RC}" >> $GITHUB_OUTPUT
          echo ""
          echo "=== ${{ matrix.file }}: ${DURATION}s on $(hostname), rc=${RC} ==="

      - name: Upload result log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "result-${{ matrix.file }}"
          path: /tmp/result-${{ matrix.file }}.log
          if-no-files-found: warn

      - name: Cleanup namespace
        if: always()
        run: |
          oc delete project "${{ steps.ns.outputs.ns }}" --wait=false 2>/dev/null || true

  summary:
    runs-on: ubuntu-latest
    needs: [generate-matrix, chart-verifier]
    if: always()
    steps:
      - name: Summary
        run: |
          END=$(date +%s)
          START=${{ needs.generate-matrix.outputs.start_time }}
          WALL=$((END - START))
          echo "============================================="
          echo " REAL Customer Chart Load Test: kni-qe-64"
          echo "============================================="
          echo " 25 real partner/redhat/community Helm charts"
          echo " (AppsCode, LangGenius, RHDH, Kyverno, Solace,"
          echo "  EAP, Quarkus, Akeyless, CastAI, etc.)"
          echo " Concurrency: max-parallel 25"
          echo " chart-verifier result: ${{ needs.chart-verifier.result }}"
          echo " Wall time: ${WALL}s"
          echo "============================================="
